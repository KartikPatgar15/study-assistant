# ─── Application ──────────────────────────────────────────────────────────────
spring.application.name=study-assistant
server.port=8081

# ─── Database (disabled in M01 – reintroduced in M02) ─────────────────────────
# JPA and DataSource auto-configuration are excluded so the application starts
# without a PostgreSQL connection. Remove these two lines when M02 adds the
# datasource properties and JPA entities.
spring.autoconfigure.exclude=\
  org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,\
  org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration

# ─── Jackson ──────────────────────────────────────────────────────────────────
spring.jackson.serialization.write-dates-as-timestamps=false
spring.jackson.default-property-inclusion=non_null

# ─── Actuator ─────────────────────────────────────────────────────────────────
# Expose only the health endpoint publicly; full detail reserved for future admin module.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when-authorized

# ─── CORS (overridden per profile) ────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.root=INFO
logging.level.com.studyassistant=DEBUG
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} - %msg%n

# ─── JPA / Database ───────────────────────────────────────────────────────────
# Actual connection values come from the active profile (local / prod).
# Hibernate DDL is intentionally set to 'none' in base config; use migrations in production.
spring.jpa.hibernate.ddl-auto=none
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.format_sql=true
