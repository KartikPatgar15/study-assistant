# ─────────────────────────────────────────────────────────────────────────────
# Local development profile
# Copy this file to application-local.properties and fill in your values.
# application-local.properties is git-ignored.
# ─────────────────────────────────────────────────────────────────────────────

# ─── Database (Supabase PostgreSQL) ───────────────────────────────────────────
spring.datasource.url=jdbc:postgresql://<HOST>:<PORT>/<DATABASE>
spring.datasource.username=<USERNAME>
spring.datasource.password=<PASSWORD>
spring.datasource.driver-class-name=org.postgresql.Driver

# During local development you can let Hibernate create/update the schema.
# Use Flyway or Liquibase in production instead.
spring.jpa.hibernate.ddl-auto=update

# ─── CORS ─────────────────────────────────────────────────────────────────────
app.cors.allowed-origins=http://localhost:5173

# ─── Supabase Storage (used from M02) ─────────────────────────────────────────
supabase.url=https://<PROJECT_REF>.supabase.co
supabase.anon-key=<ANON_KEY>
supabase.storage.bucket=study-documents

# ─── AI Provider (placeholder – used from M03) ────────────────────────────────
# ai.provider=gemini
# ai.gemini.api-key=<GEMINI_API_KEY>

# ─── Logging ──────────────────────────────────────────────────────────────────
logging.level.com.studyassistant=DEBUG
logging.level.org.hibernate.SQL=DEBUG
